    <script>
      (function() {
        // Prevent Vite HMR WebSocket disconnects from triggering spurious page reloads in iframe/Cloud Run
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = false;
            try {
              if (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) {
                isViteHmr = true;
              } else if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) {
                isViteHmr = true;
              } else if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1)) {
                isViteHmr = true;
              }
            } catch (e) {}

            if (isViteHmr) {
              // Provide an inert mock WebSocket that reports OPEN, dispatches 'open',
              // and never emits 'close' or 'error' events.
              // This completely eliminates Vite client's `vite:ws:disconnect -> polling -> location.reload()` cycle.
              var dummy = new EventTarget();
              dummy.url = url;
              dummy.readyState = 1; // WebSocket.OPEN
              dummy.bufferedAmount = 0;
              dummy.extensions = '';
              dummy.protocol = 'vite-hmr';
              dummy.binaryType = 'blob';
              dummy.send = function() {};
              dummy.close = function() {};
              dummy.onopen = null;
              dummy.onclose = null;
              dummy.onerror = null;
              dummy.onmessage = null;

              setTimeout(function() {
                var openEvt = new Event('open');
                if (typeof dummy.onopen === 'function') dummy.onopen(openEvt);
                dummy.dispatchEvent(openEvt);
              }, 10);

              return dummy;
            }

            return new OriginalWebSocket(url, protocols);
          };

          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Suppress harmless Vite HMR WebSocket connection errors in iframe/Cloud Run environment
        window.addEventListener('error', function(event) {
          if (
            (event.message && (event.message.includes('WebSocket') || event.message.includes('createWebSocketModuleRunnerTransport'))) ||
            (event.filename && event.filename.includes('@vite/client'))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason ? String(event.reason) : '';
          if (
            reason.includes('WebSocket') ||
            reason.includes('createWebSocketModuleRunnerTransport') ||
            reason.includes('@vite/client')
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
    <script>
      (function() {
        try {
          var matchMedia = window.matchMedia('(prefers-color-scheme: dark)');
          function applyTheme(isDark) {
            if (isDark) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          }
          applyTheme(matchMedia.matches);
          if (matchMedia.addEventListener) {
            matchMedia.addEventListener('change', function(e) { applyTheme(e.matches); });
          } else if (matchMedia.addListener) {
            matchMedia.addListener(function(e) { applyTheme(e.matches); });
          }
        } catch (e) {}
      })();
    </script>
